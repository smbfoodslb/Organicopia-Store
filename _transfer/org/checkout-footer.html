<script>
(function(){
  if (location.pathname.indexOf('/shop/address') !== 0) return;
  var PLACEHOLDER = '@no-email.invalid'; // Odoo insists on an email; a reserved .invalid address is dropped again once the order is placed
  function label(el){ var box = el.closest('div'); return box && box.querySelector('label'); }
  function form(){ return document.querySelector('form.address_autoformat') || document.querySelector('form[action*="/shop/address"]'); }
  function sync(){ var f = form(); if (!f) return;
    var p = f.querySelector('input[name="phone"]'); if (p && !p.required) { p.required = true; }
    var e = f.querySelector('input[name="email"]'); if (e && !e.required) { e.required = true; } // 16 Nov 2026: email is required again - the order confirmation goes by email
    var c = f.querySelector('select[name="country_id"]'); if (c && !c.value && !f.dataset.orgCountry) { f.dataset.orgCountry = '1'; var o = [].slice.call(c.options).find(function(x){ return x.textContent.trim() === 'Lebanon'; }); if (o) { c.value = o.value; c.dispatchEvent(new Event('change', {bubbles: true})); } }
    // Odoo re-marks required fields after the country loads, so the labels are kept in step with the live "required" flags
    [].slice.call(f.querySelectorAll('input, select, textarea')).forEach(function(i){ if (i.type === 'hidden' || i.name === 'country_id') return; var l = label(i); if (!l) return;
      var mk = l.querySelector('.s_website_form_mark'), opt = l.querySelector('.org-opt');
      if (i.required) { if (opt) opt.remove(); if (!mk) l.insertAdjacentHTML('beforeend', ' <span class="s_website_form_mark">*</span>'); }
      else { if (mk) mk.remove(); if (!opt) l.insertAdjacentHTML('beforeend', ' <span class="org-opt text-muted small">(optional)</span>'); }
    });
    if (!f.dataset.org) { f.dataset.org = '1';
      function fill(){ /* 16 Nov 2026: no placeholder email any more - the customer must enter one */ }
      // the Confirm button sits outside the form (in the order summary), so listen on the whole page
      document.addEventListener('click', function(ev){ if (ev.target.closest('button, [type="submit"], a.btn')) fill(); }, true);
      document.addEventListener('submit', fill, true);
      document.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') fill(); }, true);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync); else sync();
  new MutationObserver(sync).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['required'] });
  var n = 0, t = setInterval(function(){ sync(); if (++n > 40) clearInterval(t); }, 500);
})();
</script>

<script>

      var tok = form.querySelector('input[name="csrf_token"]'); cp.querySelector('[name="csrf_token"]').value = tok ? tok.value : '';

      /* "State / Province" becomes "Governorate": required for delivery, one line per governorate */
      var gov = function () {
        var s = stateSel(); if (!s) return;
        var l = id('div_state') && id('div_state').querySelector('label');
        if (l) [].slice.call(l.childNodes).forEach(function (n) { if (n.nodeType === 3 && /State/.test(n.nodeValue)) n.nodeValue = 'Governorate '; });
        [].slice.call(s.options).forEach(function (o) {
          if (!o.value) { if (!/governorate/.test(o.textContent)) o.textContent = 'Choose your governorate…'; return; }
          if (!AR.test(o.textContent)) return;
          var en = s.querySelector('option[value="' + (parseInt(o.value, 10) - 1) + '"]');
          if (!en || en === o) return;                       /* already merged, or no English twin */
          if (o.selected) s.value = en.value;
          if (!AR.test(en.textContent)) en.textContent = (NAMES[en.value] || en.textContent.trim()) + ' \u00b7 ' + o.textContent.trim();
          o.remove();
        });
        if (!id('smbGovHint')) { var h = document.createElement('small'); h.id = 'smbGovHint'; h.className = 'text-muted'; h.style.display = 'block'; h.style.marginTop = '4px';
          h.textContent = 'Greater Beirut covers Beirut and nearby areas such as Hazmieh, Jdeideh, Zalka and Jal el Dib. For Antelias, Baabda, Hadath, Khalde and beyond, choose Mount Lebanon.'; s.insertAdjacentElement('afterend', h); }
        var need = sel !== PICKUP; if (s.required !== need) s.required = need;
      };
      var seq = 0, lastDisc = 0;
      var refresh = function () {
        var pick = sel === PICKUP, c = pick ? PICKUP : zone();
        var fee = pick || goods >= FREE_FROM ? 0 : (c ? FEES[c] : null); paint(goods, fee, goods + (fee || 0));
        if (!c) return;
        var tag = ++seq;
        call('/shop/set_delivery_method', { dm_id: parseInt(c, 10) }).then(function (r) { if (tag !== seq) return; var tot = num(r.amount_total), del = num(r.amount_delivery); goods = Math.round((tot - del) * 100) / 100; paint(goods, del, tot);
          lastDisc = disc(r);
          /* shown amount: the discount lines of Odoo's own order summary (VAT included); the figure in the answer is without VAT */
          var shown = 0, tb = document.querySelector('.o_cart_products_table'); if (tb) tb.querySelectorAll('[data-reward-type] .oe_currency_value').forEach(function (x) { shown += Math.abs(num(x.textContent)); });
          id('smbDiscRow').style.display = !hasRows && lastDisc > 0 && shown > 0 ? '' : 'none'; id('smbDisc').textContent = '\u2212' + money(shown); }).catch(function () {});
      };
      appliedOnOrder().then(function (list) { var html = '', sum = 0, code = null;
        list.forEach(function (c) { var a = Math.abs(+c.amount || 0); sum += a; if (c.kind === 'code' && !code) code = { n: c.code || c.name, a: a };
          html += '<div class="r"><span>' + (c.kind === 'points' ? 'Rewards points' : 'Coupon ' + escT(c.code || c.name)) + '</span><span>\u2212' + money(a) + '</span></div>'; });
        if (!list.length) return;
        appliedSum = Math.round(sum * 100) / 100; hasRows = true; id('smbDiscRows').innerHTML = html; id('smbDiscRow').style.display = 'none'; refresh();
        /* one coupon per order: the box names the code instead of asking for another */
        if (code) { cp.innerHTML = '<div class="smb-h">Coupon code</div><div class="ok">' + escT(code.n) + ' applied: \u2212' + money(code.a) + '</div>'; } }).catch(function () {});
      var choose = function (m) {
        sel = m; var pick = m === PICKUP;
        ship.querySelectorAll('.smb-opt').forEach(function (l) { var i = l.querySelector('input'); i.checked = i.value === m; l.classList.toggle('on', i.value === m); });
        rows.forEach(function (r) { var e = id(r); if (e) e.style.display = pick ? 'none' : ''; });
        Object.keys(AUTO).forEach(function (k) { var i = form.querySelector('[name="' + k + '"]'); if (!i) return;
          if (pick && !i.value.trim()) i.value = AUTO[k]; else if (!pick && i.value === AUTO[k]) i.value = ''; });
        gov(); refresh();
      };
      form.addEventListener('change', function (ev) { if (ev.target.name === 'state_id') refresh(); });
      new MutationObserver(function () { gov(); opt(); }).observe(form, { childList: true, subtree: true, attributes: true, attributeFilter: ['required'] });
      setTimeout(function () { gov(); refresh(); opt(); }, 1200); setTimeout(opt, 3000); setTimeout(opt, 6000);
      ship.addEventListener('change', function (ev) { if (ev.target.name === 'smb_m') choose(ev.target.value); });
      choose(sel);
      document.querySelectorAll('[name="website_sale_main_button"] span').forEach(function (s) { if (s.textContent.trim() === 'Confirm') s.textContent = 'Confirm order'; });
      var wz = document.querySelector('main p.text-center.mb-0 > span'); wz = wz && wz.closest('.col-12'); if (wz && !wz.querySelector('form')) wz.style.display = 'none';
      document.querySelectorAll('main .alert-warning').forEach(function (x) { x.style.display = 'none'; }); /* Odoo's "you are editing your delivery and billing addresses" notice */
      var h4 = document.querySelector('main h4.mb-3'); if (h4) h4.textContent = 'Checkout';

      /* ---- a required field left empty used to fail silently (it sat under the fixed Confirm bar) ---- */
      var show = function () {
        form.querySelectorAll('.smb-missing').forEach(function (x) { x.remove(); });
        form.querySelectorAll('.smb-bad').forEach(function (x) { x.classList.remove('smb-bad'); });
        var bad = form.querySelector('input:invalid, select:invalid, textarea:invalid'); if (!bad) return;
        form.querySelectorAll('input:invalid, select:invalid, textarea:invalid').forEach(function (el) { el.classList.add('smb-bad'); });
        var m = document.createElement('div'); m.className = 'smb-missing';
        m.textContent = bad.validity.valueMissing ? 'Please fill in this field.' : (bad.type === 'email' ? 'Please enter a valid email address.' : 'Please check this field.');
        bad.insertAdjacentElement('afterend', m);
        try { bad.focus({ preventScroll: true }); } catch (e) {}
        setTimeout(function () { bad.scrollIntoView({ block: 'center', behavior: 'instant' }); }, 50);
      };
      document.addEventListener('click', function (ev) {
        var btn = ev.target.closest('[name="website_sale_main_button"]'); if (!btn) return;
        if (!form.checkValidity()) { ev.preventDefault(); ev.stopPropagation(); show(); }
        else put(sel === PICKUP ? PICKUP : zone(), lastDisc, payWith);
      }, true);
      form.addEventListener('input', function (ev) {
        var el = ev.target; if (el.classList && el.classList.contains('smb-bad') && el.checkValidity()) {
          el.classList.remove('smb-bad'); var n = el.nextElementSibling; if (n && n.classList.contains('smb-missing')) n.remove(); }
      });
    }
  }
})();
